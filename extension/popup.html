<!DOCTYPE html>
<html>
<head>
    <style>
        body { width: 350px; font-family: Arial, sans-serif; padding: 10px; margin: 0; }
        h3 { margin-top: 0; color: #333; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
        .download-item { border: 1px solid #eee; margin-bottom: 8px; padding: 8px; border-radius: 4px; }
        .filename { font-weight: bold; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .progress-bar { height: 8px; background: #eee; border-radius: 4px; margin: 5px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: #4CAF50; width: 0%; }
        .details { font-size: 11px; color: #666; display: flex; justify-content: space-between; }
        .controls button { font-size: 11px; padding: 2px 5px; margin-right: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h3>IDM Clone - Active Downloads</h3>
    <div id="downloads-list">Loading...</div>
    <script src="popup.js"></script>
</body>
</html>
